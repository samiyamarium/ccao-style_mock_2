<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCAO-F Practice Exam – Block 2</title>
<style>
:root{--bg:#faf9f5;--card:#fff;--tx:#1f1e1d;--mu:#6b6960;--bd:#e3e0d5;--ac:#c96442;--ok:#2e7d4f;--no:#b3392f;--sel:#fbeee8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1e1d;--card:#2a2926;--tx:#f0eee6;--mu:#a5a297;--bd:#3d3b36;--sel:#3a2a24}}
:root[data-theme="dark"]{--bg:#1f1e1d;--card:#2a2926;--tx:#f0eee6;--mu:#a5a297;--bd:#3d3b36;--sel:#3a2a24}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 0;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd);z-index:5}
.t{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px}.t.lo{color:var(--no)}
.pg{height:6px;background:var(--bd);border-radius:3px;margin:8px 0 16px}.pg i{display:block;height:100%;background:var(--ac);border-radius:3px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:14px}
.dm{color:var(--ac);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.o{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:10px;padding:12px 14px;margin:9px 0;font:inherit;cursor:pointer}
.o:hover{border-color:var(--ac)}.o.s{background:var(--sel);border-color:var(--ac)}
.o.ok{border-color:var(--ok);background:rgba(46,125,79,.12)}.o.no{border-color:var(--no);background:rgba(179,57,47,.12)}
button.b{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer}
button.b.g{background:transparent;color:var(--tx);border:1.5px solid var(--bd)}button.b:disabled{opacity:.4;cursor:default}
.r{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.big{font-size:56px;font-weight:800;text-align:center;margin:0}.c{text-align:center}
.star{font-size:96px;text-align:center;animation:sh 1.6s ease-in-out infinite;filter:drop-shadow(0 0 14px gold)}
@keyframes sh{0%,100%{transform:scale(1) rotate(-6deg);filter:drop-shadow(0 0 8px gold)}50%{transform:scale(1.18) rotate(6deg);filter:drop-shadow(0 0 28px gold)}}
.sp{position:fixed;font-size:22px;pointer-events:none;animation:fl 2.4s ease-out forwards}
@keyframes fl{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-140px)}}
.ex{font-size:14.5px;color:var(--mu);border-top:1px dashed var(--bd);margin-top:10px;padding-top:10px}
.dr{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;border-bottom:1px solid var(--bd)}
.nav{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}.nav span{width:30px;height:30px;border-radius:6px;border:1px solid var(--bd);display:grid;place-items:center;font-size:12px;cursor:pointer}.nav .d{background:var(--ac);color:#fff;border-color:var(--ac)}.nav .c2{outline:2px solid var(--tx)}
</style></head><body><div class="w" id="app"></div>
<script>
const Q=[
{d:"Prompting & Task Execution",q:"A legal-ops team asks Claude to extract indemnity, termination and governing-law clauses from vendor contracts into a fixed table. Results vary: column names change, some clauses are paraphrased, and missing clauses are silently skipped. Which prompt revision is most effective?",o:["Add a long list of strict rules in capital letters, since emphasis makes the model comply more consistently.","Ask Claude to be 'consistent' and rerun the batch until two outputs match.","Switch to a larger model and keep the prompt unchanged, since format drift is a capability problem.","Specify the exact output schema, give two or three varied worked examples (including one where a clause is absent and the cell reads 'Not found'), and require verbatim quotes."],a:3,e:"Examples plus an explicit format define the product precisely and cover edge cases such as missing clauses. Emphasis, reruns and model size do not define the target output."},
{d:"Prompting & Task Execution",q:"A consultant pastes two long client reports, a style guide and a request into one message. Claude blends the style guide's sample text into its summary of Report B and answers a question nobody asked. What is the best fix?",o:["Shorten the reports until the message is small enough for Claude to focus.","Paste the request first and hope the model remembers it after the documents.","Separate the pieces with clear labels or tags (for example, report_a, report_b, style_guide), place the documents first, and state the task and constraints clearly at the end.","Ask Claude to read the message three times before answering."],a:2,e:"Clear delimiters let the model distinguish source material from instructions, and a task stated after the documents is followed more reliably. Trimming loses content; asking for rereads is not a mechanism."},
{d:"Output Evaluation",q:"A founder shares a business plan with Claude. Claude praises it and agrees with every assumption, including a 40% month-over-month growth rate sustained for two years. The founder wants a useful stress test. Which approach is best?",o:["Trust the praise; a detailed positive response indicates a sound plan.","Set a performance description: challenge weak assumptions, list assumptions with supporting evidence, flag uncertainty, and argue the strongest case against the plan before giving any recommendation.","Ask Claude 'Are you sure?' repeatedly until it changes its answer.","Remove numbers from the plan so the model cannot anchor on them."],a:1,e:"Agreeableness is a behavior you can direct. Asking for assumptions, evidence and the best counterargument makes weak reasoning visible. Repeated 'are you sure' just pressures the model."},
{d:"Output Evaluation",q:"An analyst uses Claude to write a market overview with 14 references. The references have plausible authors, journals and years. The report goes to a client in two days. What should the analyst do before sending it?",o:["Send it, since real-looking authors and journals indicate genuine sources.","Ask Claude to confirm that all citations are real and accept a yes.","Remove the reference list and keep the claims, which reduces risk of an error being spotted.","Open each source, confirm it exists and actually supports the claim it is attached to, and replace or remove anything that cannot be verified."],a:3,e:"Fluent, exact-looking citations are a classic hallucination sign. Claude's self-confirmation is not evidence. Verification means opening the source and checking the claim. Removing references hides the problem."},
{d:"Troubleshooting & Optimization",q:"A compliance team classifies incoming messages as 'reportable' or 'not reportable' with Claude. Running the same message twice occasionally gives different labels. The lead wants to stop using AI entirely. What is the best response?",o:["Expect some variation, so constrain the label set and output format, test on a set of trusted labeled cases to measure agreement, and route ambiguous or low-agreement items to human review.","Ask Claude to promise that it will always give the same label.","Run each message ten times and pick a random result.","Fix it by making the prompt shorter, which removes all randomness."],a:0,e:"Variation between runs is expected. Handle it with tighter definitions, an eval set and human review of borderline cases rather than abandoning the tool or trusting promises."},
{d:"Troubleshooting & Optimization",q:"A team's prompt says 'Keep it short, don't be wordy, avoid long paragraphs.' Claude keeps returning 400-word replies to a chat widget that displays about 80 words. Which change is most likely to fix it?",o:["Repeat 'SHORT' several more times in bold.","Increase the length of the system prompt to explain why brevity matters.","Ask users to interrupt when replies are too long.","State a concrete, positive target ('Reply in at most 80 words, in plain sentences with no bullet lists'), give one example reply, and test against a set of typical questions."],a:3,e:"Vague negatives are weak constraints. A measurable target with an example, tested on realistic inputs, is a clear product description. Emphasis and length do not add precision."},
{d:"Model & Feature Selection",q:"A product manager wants a small interactive pricing calculator that colleagues can open, tweak and share, plus iterate on it over several turns. Which approach fits best?",o:["Ask Claude to describe the formulas in text and paste them into a spreadsheet by hand.","Use Artifacts, which give a working, editable, shareable page that updates as the conversation iterates.","Use a research mode, which is designed for building interactive tools.","Ask for a screenshot of a calculator so the team can copy the layout."],a:1,e:"Artifacts are built for standalone, iterable outputs such as small tools and documents. Research modes gather and cite information; they do not build interactive tools."},
{d:"Model & Feature Selection",q:"A strategy lead needs a comparison of 12 competitors, with pricing pages, recent announcements and analyst commentary, and sources cited. A single-turn chat answer gave thin, undated claims. Which option is best?",o:["Paste the competitor names again with 'be detailed'.","Use a bigger model, since depth of research is determined by model size alone.","Ask for the answer from memory, then have Claude rate its own certainty.","Use a research capability that searches multiple sources and cites them, then spot-check the important claims against the original pages."],a:3,e:"Multi-source, current, cited work is what research/search features are for. Model size does not add current information, and self-rated certainty is not verification. Spot-checks remain necessary."},
{d:"Workflow Integration",q:"A firm uses Claude to draft three kinds of output: an internal brainstorm note, a client-facing marketing email, and a payment instruction sent to a bank. The team debates one review rule for all three. What is the best design?",o:["One rule: nothing needs review because the drafts are AI-assisted and edited.","Scale review to impact and reversibility: a glance for the note, a full read for the email, and a documented human approval before the irreversible payment.","Require senior sign-off for everything so nothing slips through.","Review only after sending, since errors can be corrected later."],a:1,e:"The more people a result reaches and the less reversible the action, the deeper the check. Irreversible steps need their check before the act. Uniform rules waste effort or leave gaps."},
{d:"Workflow Integration",q:"A support team wants an AI agent to handle 90% of routine tickets. Refunds, legal threats and unclear cases should never be handled autonomously. Which design is best?",o:["Let the agent resolve everything and monitor complaint volume.","Set a confidence threshold only; anything the model feels sure about is auto-resolved.","Define explicit escalation rules by category and risk (refunds above a limit, legal language, missing information), give the agent a route to hand off with context to a named person, and evaluate escalation accuracy on past tickets.","Have the agent ask customers whether they want a human."],a:2,e:"Boundaries and escalation must be built in beforehand, because nobody watches every decision. Model-reported confidence is a weak trigger, and leaving the choice to customers does not control risk."},
{d:"Configuration & Knowledge",q:"A bank deploys a Claude-based help assistant. Every conversation must use the bank's tone, decline to give personalized investment advice, and cite the policy document used. Staff currently paste these rules at the start of each chat and often forget. What is the best configuration?",o:["Ask staff to write the rules more carefully each time.","Rely on Claude to remember the rules from the last chat.","Add the rules to each user message using a keyboard shortcut.","Place the standing rules in system instructions (or project instructions), so every conversation starts with them, and keep the policy documents in the project's knowledge."],a:3,e:"A system prompt makes a performance description permanent and applies it to every chat. Per-message pasting is fragile, and the model itself starts each chat with nothing."},
{d:"Configuration & Knowledge",q:"A team connects Claude to their company drive so it can answer questions about project files. IT notices the connector has read and write access to the entire drive, including HR and legal folders. What is the best action?",o:["Apply least privilege: limit the connector to the specific folders needed, prefer read-only access, review the permissions and test with realistic questions before wider use.","Keep full access, because Claude will only look at files that are relevant.","Remove all access and keep all projects manual forever.","Give every employee the connector's admin credentials so they can manage it."],a:0,e:"Connectors extend Claude's reach, so permissions define what it can see or change. Scope narrowly and verify. Trust in relevance is not an access control, and removing everything gives up the benefit."},
{d:"Configuration & Knowledge",q:"After enabling memory, a project manager expects Claude to 'know' the client's goals in every new chat and is surprised when a fresh chat lacks a detail from six weeks ago. A colleague says the model has forgotten. What is the most accurate guidance?",o:["Memory permanently trains the model on the manager's chats.","Memory should be turned off, because it cannot work.","The model itself carries nothing between chats. Memory saves notes and feeds them into later chats, so stable client context is more reliable in project knowledge or standing instructions that you review and keep current.","Ask Claude to try harder to recall the details."],a:2,e:"A memory feature stores notes and sends them into the next chat; the model still starts fresh. Important stable context belongs where it is deliberately maintained."},
{d:"Governance & Responsible Use",q:"An associate at a firm working on a confidential acquisition wants to summarize draft deal documents. The company has an approved enterprise Claude account with defined data terms, but a consumer app on his phone is faster. Which choice is most responsible?",o:["Use the consumer app, deleting the chat afterwards.","Use the approved account under the firm's data-classification rules, redact where possible, and tell the policy owner if the approved route is too hard so it can be fixed.","Split the documents into small pieces so none looks confidential.","Use the consumer app but replace only the company names."],a:1,e:"Creation diligence starts with an approved tool and data rules. Deleting chats, fragmenting documents or partial redaction do not address who can access or retain the data. Friction in the approved path is a policy problem to report."},
{d:"Governance & Responsible Use",q:"A consultancy delivers monthly reports partly drafted by Claude. Some client contracts require disclosure of automated tools, and a regulator-facing report affects thousands of people. A partner asks whether disclosure matters if the output is accurate. What is the best guidance?",o:["No disclosure is ever needed if a human edits the text.","Disclose everything on every document, including personal notes.","Disclosure depends only on whether the output is free of errors.","Match transparency to impact: check contractual and legal requirements, disclose where AI's role matters to those affected, verify facts and calculations, and keep a named human who signs and owns the report."],a:3,e:"The more an AI-assisted result affects others, the stronger the case for transparency, and accountability cannot be automated. Accuracy alone does not remove contractual or legal obligations."},
{d:"Troubleshooting & Optimization",q:"A company created a reusable skill for reviewing purchase contracts, but Claude rarely uses it. The skill's description says only 'Helps with documents'. Which fix is most likely to help?",o:["Rewrite the description to state clearly what the skill does and when it should be used (for example, reviewing purchase or vendor contracts for payment, liability and termination terms), then test with realistic requests.","Ask users to type the skill's file name in every request.","Duplicate the skill under five different names.","Make the skill's instructions longer so it is noticed."],a:0,e:"A skill's description is how Claude decides whether it applies. Vague descriptions cause missed triggers; clear scope and trigger conditions, tested on realistic requests, fix it. Length inside the skill does not help discovery."}
];
const PASS=72,SEC=3600,app=document.getElementById('app');
let ans=Array(Q.length).fill(-1),cur=0,left=SEC,tm=null,done=false,rev=false;
const L="ABCD";
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function start(){app.innerHTML=`<div class="card"><div class="dm">Practice Exam · Block 2 of 5</div><h1 style="margin:.2em 0">CCAO-F Practice Exam</h1><p>Questions 16–30: 15 new scenario-based questions covering all seven blueprint domains, built from the Agent Factory study guide (4Ds, output evaluation, workflow design, skills &amp; connectors, governance).</p><p><b>Time:</b> 60 minutes · <b>Pass:</b> ${PASS}% (${Math.ceil(Q.length*PASS/100)} of ${Q.length}) · Feedback is shown only after you submit.</p><button class="b" onclick="go()">Start exam</button></div>`}
function go(){tm=setInterval(()=>{left--;const e=document.getElementById('tm');if(e){e.textContent=fmt(left);e.classList.toggle('lo',left<300)}if(left<=0)finish()},1000);draw()}
function draw(){const q=Q[cur];app.innerHTML=`<div class="bar"><span>Question ${cur+1}/${Q.length}</span><span class="t" id="tm">${fmt(left)}</span><button class="b" style="padding:7px 12px;font-size:14px" onclick="sub()">■ Stop &amp; get result</button></div><div class="pg"><i style="width:${(ans.filter(x=>x>=0).length/Q.length)*100}%"></i></div><div class="card"><div class="dm">${q.d}</div><p><b>Scenario:</b> ${q.q}</p>${q.o.map((t,i)=>`<button class="o ${ans[cur]===i?'s':''}" onclick="pick(${i})"><b>${L[i]})</b> ${t}</button>`).join('')}</div><div class="r"><button class="b g" onclick="mv(-1)" ${cur?'':'disabled'}>← Back</button>${cur<Q.length-1?`<button class="b" onclick="mv(1)">Next →</button>`:`<button class="b" onclick="sub()">Submit exam</button>`}</div><div class="nav">${Q.map((_,i)=>`<span class="${ans[i]>=0?'d':''} ${i===cur?'c2':''}" onclick="cur=${i};draw()">${i+1}</span>`).join('')}</div>`}
function pick(i){ans[cur]=i;draw()}function mv(n){cur+=n;draw()}
function sub(){const u=ans.filter(x=>x<0).length;if(!u||confirm(u+' question(s) unanswered. Submit anyway?'))finish()}
function finish(){if(done)return;done=true;clearInterval(tm);result()}
function result(){const ok=Q.map((q,i)=>ans[i]===q.a),n=ok.filter(Boolean).length,p=Math.round(n/Q.length*1000)/10,pass=p>=PASS;
const dom={};Q.forEach((q,i)=>{dom[q.d]=dom[q.d]||[0,0];dom[q.d][1]++;if(ok[i])dom[q.d][0]++});
app.innerHTML=`<div class="card">${pass?'<div class="star">⭐</div>':''}<h1 class="c" style="margin:.1em 0">${pass?'You passed! 🎉':'Not quite yet'}</h1><p class="big" style="color:${pass?'var(--ok)':'var(--no)'}">${p}%</p><p class="c">${n} of ${Q.length} correct · pass mark ${PASS}% · time used ${fmt(SEC-left)}</p><p class="c">${pass?'Outstanding work, shining star! Ready for Block 3.':'Review the explanations below, then retry. Weak domains are the likeliest to sink you on a different question draw.'}</p></div><div class="card"><b>Score by domain</b>${Object.entries(dom).map(([k,v])=>`<div class="dr"><span>${k}</span><span>${v[0]}/${v[1]}</span></div>`).join('')}</div><div class="r"><button class="b" onclick="rv()">Review answers</button><button class="b g" onclick="location.reload()">Retake</button></div>`;
if(pass)for(let i=0;i<28;i++)setTimeout(()=>{const s=document.createElement('div');s.className='sp';s.textContent=['⭐','✨','🌟'][i%3];s.style.left=Math.random()*95+'vw';s.style.top=(40+Math.random()*50)+'vh';document.body.appendChild(s);setTimeout(()=>s.remove(),2500)},i*90)}
function rv(){app.innerHTML=`<div class="r"><button class="b g" onclick="result()">← Results</button></div>`+Q.map((q,i)=>`<div class="card"><div class="dm">Q${i+1} · ${q.d}</div><p>${q.q}</p>${q.o.map((t,j)=>`<div class="o ${j===q.a?'ok':(j===ans[i]?'no':'')}"><b>${L[j]})</b> ${t}${j===ans[i]?' <i>(your answer)</i>':''}</div>`).join('')}<div class="ex"><b>Correct: ${L[q.a]}.</b> ${q.e}</div></div>`).join('')}
start();
</script></body></html>
