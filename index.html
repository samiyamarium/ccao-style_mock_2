<script>
const Q=[
{d:"Prompting & Task Execution",q:"A legal-ops team asks Claude to extract indemnity, termination and governing-law clauses from vendor contracts into a fixed table. Results vary: column names change, some clauses are paraphrased, and missing clauses are silently skipped. Which prompt revision is most effective?",o:[
"Add a long list of strict formatting rules written in all capital letters and repeated emphasis such as 'YOU MUST FOLLOW THIS EXACTLY,' on the reasoning that stronger typographic emphasis and repeated insistence reliably increases a model's adherence to formatting instructions across a large, varied batch of contracts.",
"Ask Claude to be more 'consistent' in a short added sentence, and simply rerun the same batch of contracts repeatedly until two of the resulting outputs happen to match each other closely enough to be considered reliable and ready for use.",
"Switch to a larger, more capable model while leaving the prompt itself completely unchanged, on the assumption that the observed format drift (changing column names, paraphrasing, silently skipped clauses) is fundamentally a capability limitation of the current model tier rather than a specification problem in how the task was described.",
"Specify the exact output schema (column names and order) explicitly, provide two or three varied worked examples that include at least one case where a clause is genuinely absent from the contract and the correct cell reads 'Not found' rather than being silently skipped, and require that every extracted clause be quoted verbatim from the source contract rather than paraphrased."
],a:3,e:"Concrete worked examples plus an explicit schema define the target output precisely, including the tricky edge case of a genuinely missing clause, which is exactly the case currently being mishandled. Capitalized emphasis and repeated reruns hoping for a lucky match are not specification mechanisms, and a bigger model does not know your desired column names or how you want missing clauses handled any better than a smaller one does without being told."},
{d:"Prompting & Task Execution",q:"A consultant pastes two long client reports, a style guide and a request into one message. Claude blends the style guide's sample text into its summary of Report B and answers a question nobody asked. What is the best fix?",o:[
"Shorten both reports substantially before pasting them in, on the theory that reducing the raw amount of text in the message is the most direct way to help the model correctly focus on and distinguish between the different pieces of content it has been given.",
"Move the actual task request to the very beginning of the message, ahead of all the pasted documents, on the reasoning that instructions placed first are more likely to be remembered and correctly applied by the model even after it has processed a large volume of subsequent document text.",
"Separate the distinct pieces of content with clear labels or delimiter tags (for example, marking sections as report_a, report_b, and style_guide), place the source documents before the task instructions, and state the actual task and any constraints clearly and specifically at the end of the message, after all the source material.",
"Instruct Claude to read through the entire message three separate times before producing any answer, on the assumption that additional repeated internal passes over the same content will naturally resolve any confusion about which source document a given piece of information came from."
],a:2,e:"Clear delimiters let the model reliably distinguish source material from each other and from the instructions, and placing the actual task after the documents (rather than before them) tends to be followed more reliably than an instruction stated up front and then followed by a large amount of subsequent content. Trimming the reports loses needed content rather than fixing the mixing problem, and asking for repeated internal 'rereads' is not a real mechanism that changes how the model processes the input."},
{d:"Output Evaluation",q:"A founder shares a business plan with Claude. Claude praises it and agrees with every assumption, including a 40% month-over-month growth rate sustained for two years. The founder wants a useful stress test. Which approach is best?",o:[
"Trust the praise as a genuinely useful signal, on the reasoning that a long, detailed, and specific positive response covering multiple aspects of the plan is generally a reliable indicator that the plan itself has actually been evaluated critically and found sound.",
"Explicitly set a performance description that instructs Claude to challenge weak assumptions directly, to list out each key assumption alongside whatever supporting evidence (or lack thereof) exists for it, to flag genuine uncertainty rather than smoothing over it, and to argue the strongest possible case against the plan before offering any final recommendation.",
"Repeatedly ask Claude 'Are you sure?' after each of its responses until its tone shifts and it begins expressing more doubt about the plan, treating that eventual shift in tone as evidence that a more genuinely critical evaluation has now been reached.",
"Strip all specific numbers and percentages out of the business plan before sharing it with Claude, on the theory that removing concrete figures like the 40% growth assumption prevents the model from anchoring too strongly on any single number and thereby produces a more balanced, holistically critical response."
],a:1,e:"Sycophantic agreement is a directable behavior, not a fixed trait: explicitly asking for challenged assumptions, supporting evidence, flagged uncertainty, and the strongest counterargument produces a genuinely useful stress test. A long, warm, detailed response is not evidence of critical evaluation — it can just as easily be detailed agreement. Repeating 'are you sure?' is social pressure, not an evaluative instruction, and removing the actual numbers under review would prevent any meaningful stress test of the specific 40% assumption at all."},
{d:"Output Evaluation",q:"An analyst uses Claude to write a market overview with 14 references. The references have plausible authors, journals and years. The report goes to a client in two days. What should the analyst do before sending it?",o:[
"Send the report as written, since references with plausible, specific-sounding author names, real-looking journal titles, and reasonable publication years are generally a strong indicator that the citations themselves are genuine rather than fabricated by the model.",
"Ask Claude directly to confirm that all 14 citations are real and accurately represent their sources, and accept a straightforward 'yes, they are all accurate and verified' response from the model as sufficient confirmation before sending the report to the client.",
"Remove the reference list from the final report while keeping all the underlying factual claims intact, on the reasoning that a report making the same substantive claims but without an attached bibliography reduces the risk that any single fabricated-looking citation will be independently spotted and questioned by the client.",
"Open each of the 14 references individually to confirm the source genuinely exists and that it actually supports the specific claim it has been attached to in the report, and replace or remove any reference (or its associated claim) that cannot be verified this way before the report goes out."
],a:3,e:"Plausible, exact-looking citations — realistic author names, real journal titles, reasonable years — are a classic and specifically dangerous form of hallucination precisely because they look genuine at a glance. A model's own self-confirmation that its citations are accurate is generated text, not independent verification, and quietly removing the reference list preserves the underlying unverified claims while removing the one thing that would let someone check them. Actually opening and checking each source against its attached claim is the only step here that constitutes real verification."},
{d:"Troubleshooting & Optimization",q:"A compliance team classifies incoming messages as 'reportable' or 'not reportable' with Claude. Running the same message twice occasionally gives different labels. The lead wants to stop using AI entirely. What is the best response?",o:[
"Accept some run-to-run variation as an unavoidable and acceptable cost of using AI, constrain the label set and required output format as tightly as possible to reduce ambiguity, test the classifier against a set of trusted, already human-labeled cases to measure how often it actually agrees with itself and with ground truth, and route genuinely ambiguous or low-agreement items to human review rather than trusting either automated label blindly.",
"Ask Claude to explicitly promise that it will always produce the exact same label for the exact same message every single time going forward, treating that stated commitment as a reliable guarantee of consistent classification behavior in future use.",
"Run every single incoming message through the classifier ten separate times and then select one of the ten resulting labels essentially at random, on the theory that generating more total outputs per message somehow improves the reliability of whichever single label ultimately gets chosen and used.",
"Shorten the classification prompt as much as possible on the assumption that prompt length is the direct and primary cause of any run-to-run variation in the model's output, and that a sufficiently short prompt will eliminate that variation entirely."
],a:0,e:"Some variation between runs is expected behavior for generative models and does not by itself mean the tool is unusable; the right response is tighter constraints on the label set and format, measuring actual agreement against trusted ground truth, and routing ambiguous or low-agreement cases to human review. Asking for a promise is not a technical control, randomly picking among ten repeated outputs adds noise rather than removing it, and prompt length alone is not established as the cause of the observed variation."},
{d:"Troubleshooting & Optimization",q:"A team's prompt says 'Keep it short, don't be wordy, avoid long paragraphs.' Claude keeps returning 400-word replies to a chat widget that displays about 80 words. Which change is most likely to fix it?",o:[
"Repeat the word 'SHORT' several additional times in bold capital letters throughout the instructions, on the reasoning that greater visual and textual emphasis on the same underlying vague constraint will make the model more likely to actually comply with a length limit it is not currently meeting.",
"Substantially lengthen the system prompt with additional paragraphs explaining in detail why brevity matters for this particular chat widget and its users, on the theory that a more thorough justification for the constraint increases the likelihood the model will actually honor it in its output length.",
"Ask the widget's users to manually interrupt or truncate any reply that runs noticeably longer than expected, effectively treating inconsistent output length as a problem for end users to work around rather than something to be fixed in the prompt itself.",
"Replace the vague negative constraints ('don't be wordy,' 'avoid long paragraphs') with a concrete, measurable, positive target — for example, 'Reply in at most 80 words, written in plain sentences with no bullet lists' — provide one worked example reply at that length and style, and test the revised prompt against a set of typical questions the widget is likely to receive."
],a:3,e:"Vague negative instructions like 'don't be wordy' give the model nothing concrete to satisfy, whereas a measurable positive target with a worked example and realistic testing constitutes an actual, checkable specification. Adding emphasis or lengthy justification to the same vague constraint does not make it any more precise, and pushing the problem onto end users abandons the fix rather than making one."},
{d:"Model & Feature Selection",q:"A product manager wants a small interactive pricing calculator that colleagues can open, tweak and share, plus iterate on it over several turns. Which approach fits best?",o:[
"Ask Claude to describe the underlying pricing formulas in plain text, and then have someone on the team manually re-implement those formulas by typing them into a spreadsheet themselves, on the reasoning that a plain-text formula description is functionally equivalent to a working, shareable interactive tool once someone has taken the extra step of manually rebuilding it.",
"Use Artifacts, which are specifically designed to produce a working, editable, shareable output that colleagues can open directly and that can continue to be updated and refined as the conversation iterates over multiple turns, rather than requiring the underlying content to be manually rebuilt elsewhere each time it changes.",
"Use a research-oriented capability designed for multi-source information gathering and citation, on the reasoning that such a capability is generally the right tool whenever a request involves any kind of numerical calculation or structured output, including an interactive tool like a calculator.",
"Ask Claude to generate a static image or screenshot depicting what a pricing calculator interface might look like, so the team has a visual reference they can use as a design guide when someone eventually builds an actual working version separately."
],a:1,e:"Artifacts are purpose-built for exactly this need: a standalone, editable, shareable, iterable output like a small interactive tool. A research capability is built for multi-source lookup and citation, not for producing interactive tools, and both the 'describe it in text, rebuild it manually' and 'generate a reference screenshot' options leave the actual working, shareable tool unbuilt, defeating the point of the request."},
{d:"Model & Feature Selection",q:"A strategy lead needs a comparison of 12 competitors, with pricing pages, recent announcements and analyst commentary, and sources cited. A single-turn chat answer gave thin, undated claims. Which option is best?",o:[
"Paste the same list of 12 competitor names back into the same chat with the single added instruction 'be more detailed this time,' on the reasoning that a more emphatic request for detail is generally sufficient to produce genuinely current, well-sourced information about all 12 companies without changing anything else about the approach.",
"Switch to the largest available model while keeping the same single-turn chat approach unchanged, on the assumption that the depth, currency, and sourcing quality of research-style output is determined primarily by the raw scale of the underlying model rather than by whether it has access to live external sources at all.",
"Ask Claude to answer entirely from its own existing knowledge without any additional tools, and then have it separately generate a self-assessed certainty rating for each of its 12 competitor summaries, treating summaries above a certain self-rated certainty threshold as reliable enough to include without further checking.",
"Use a search- or research-enabled capability that can pull from multiple current external sources and cite them directly, covering pricing pages, recent announcements, and analyst commentary across all 12 competitors, and then spot-check the most commercially important or surprising claims against the original source pages before finalizing the comparison."
],a:3,e:"Multi-source, current, cited work of this kind is precisely what dedicated research or search capabilities exist for; asking more emphatically or switching model size within the same single-turn, no-tools approach does not add access to current external information, and a model's self-rated certainty is not independent verification. Spot-checking the most important claims remains necessary even after using a research capability."},
{d:"Workflow Integration",q:"A firm uses Claude to draft three kinds of output: an internal brainstorm note, a client-facing marketing email, and a payment instruction sent to a bank. The team debates one review rule for all three. What is the best design?",o:[
"Apply a single blanket rule that nothing needs formal review before being sent, on the reasoning that all three outputs were AI-assisted and lightly edited by a team member at some point in the drafting process, which is treated as functionally equivalent to a genuine review step regardless of the actual stakes involved.",
"Scale the depth of review to the actual impact and reversibility of each output: a quick glance for the low-stakes internal brainstorm note, a full careful read for the client-facing marketing email, and a documented, explicit human approval step required before the payment instruction — which is both externally consequential and effectively irreversible once sent — is ever actually transmitted to the bank.",
"Require senior leadership sign-off on all three types of output uniformly, including the internal brainstorm note, on the reasoning that applying the single most rigorous available review standard everywhere is the safest possible default regardless of how low-stakes or easily reversible a given piece of content actually is.",
"Allow all three types of output to be sent immediately without any prior review step, but establish a policy of reviewing anything that generated a problem only after the fact, once an actual complaint, error, or consequence has already occurred and been reported."
],a:1,e:"Review effort should scale with how many people a result reaches and how reversible the underlying action is: irreversible, externally consequential actions like a bank payment instruction need a documented approval gate before they happen, while a low-stakes internal note needs far less. A single uniform rule in either direction — no review anywhere, or maximum senior review everywhere — either leaves real risk unaddressed or wastes senior time on trivial content, and reviewing only after the fact does nothing to prevent the irreversible payment error from occurring in the first place."},
{d:"Workflow Integration",q:"A support team wants an AI agent to handle 90% of routine tickets. Refunds, legal threats and unclear cases should never be handled autonomously. Which design is best?",o:[
"Let the agent attempt to resolve all incoming tickets autonomously, including refunds and anything involving legal language, and monitor for problems indirectly by watching overall customer complaint volume as the primary signal that something has gone wrong.",
"Rely on a single confidence threshold as the only gating mechanism: whenever the model itself reports being sufficiently confident in a proposed resolution, allow that ticket to be resolved fully autonomously regardless of its actual category or risk level.",
"Define explicit escalation rules organized by ticket category and risk level (refund requests above a specific dollar limit, any message containing legal threat language, tickets with clearly missing or contradictory information), give the agent a concrete, well-defined route to hand off flagged tickets with full context to a specific named human, and separately evaluate how accurately the escalation logic itself performs against a set of past, already-resolved tickets.",
"Have the agent directly ask each customer, as part of its own reply, whether they personally would prefer to be handled by a human instead of continuing with the AI, and treat the customer's stated preference as the sole mechanism determining whether escalation occurs."
],a:2,e:"Category- and risk-based escalation rules defined up front, a concrete handoff path with context preserved, and separate evaluation of the escalation logic's own accuracy are what actually enforce the stated boundary (refunds, legal threats, and unclear cases must never be handled autonomously) — because nobody is watching every individual decision as it happens. A model's own self-reported confidence is not a reliable proxy for actual risk category, watching aggregate complaint volume only reveals problems after real harm has already occurred, and leaving the escalation decision entirely up to customer preference does not reliably catch cases the customer themselves may not recognize as high-risk."},
{d:"Configuration & Knowledge",q:"A bank deploys a Claude-based help assistant. Every conversation must use the bank's tone, decline to give personalized investment advice, and cite the policy document used. Staff currently paste these rules at the start of each chat and often forget. What is the best configuration?",o:[
"Continue asking staff to simply be more diligent and careful about remembering to paste the full set of rules manually at the start of every single new conversation, with no other change to how the system is configured.",
"Rely on Claude to automatically retain and correctly apply these standing rules from one chat to the next based on what it picked up during a previous conversation, without needing them to be explicitly restated or configured anywhere persistent.",
"Set up a keyboard shortcut or text-expansion tool that staff can use to insert the rules text more quickly into each individual user message as they type it, which still requires the rules to be manually included in every single message sent rather than being applied automatically.",
"Place the standing rules — tone requirements, the restriction against personalized investment advice, and the citation requirement — directly into the system instructions (or project instructions) so that every conversation begins with them automatically applied, and keep the actual policy documents themselves available in the project's knowledge base so they can be cited accurately."
],a:3,e:"System or project instructions make a standing performance description permanent and apply it automatically to every new conversation, which is exactly the reliability the manual-pasting workaround is failing to achieve. A keyboard shortcut still depends on someone remembering to use it every time, and the model itself starts each new chat with no memory of a previous one's context unless something persistent (instructions or a memory feature) has actually been configured to carry it forward."},
{d:"Configuration & Knowledge",q:"A team connects Claude to their company drive so it can answer questions about project files. IT notices the connector has read and write access to the entire drive, including HR and legal folders. What is the best action?",o:[
"Leave the broad read-and-write access to the entire drive exactly as configured, on the reasoning that Claude will naturally only actually look at and act on files that are genuinely relevant to whatever question is currently being asked, making the underlying breadth of the permission itself a non-issue in practice.",
"Apply the principle of least privilege: scope the connector down to only the specific folders actually needed for the intended use case, prefer read-only access wherever write access is not genuinely required, review the resulting permissions carefully, and test the configuration against realistic questions before rolling it out more broadly to the team.",
"Remove all connector access entirely and commit to keeping every future project entirely manual going forward, on the reasoning that any level of granted access beyond zero necessarily carries an unacceptable level of risk regardless of how narrowly that access might otherwise be scoped.",
"Distribute the connector's underlying administrative credentials to every employee on the team so that each person can independently manage and adjust the connector's settings and scope as they see fit for their own individual work."
],a:1,e:"Connectors extend what Claude can actually see and change, so the permissions granted directly define the real risk surface; the fix is narrowing scope to what is genuinely needed, preferring read-only, and testing before wider rollout. Trusting that the model will only look at relevant files is not an access control at all, discarding the connector entirely gives up its benefit unnecessarily, and distributing admin credentials broadly multiplies risk rather than reducing it."},
{d:"Configuration & Knowledge",q:"After enabling memory, a project manager expects Claude to 'know' the client's goals in every new chat and is surprised when a fresh chat lacks a detail from six weeks ago. A colleague says the model has forgotten. What is the most accurate guidance?",o:[
"Enabling the memory feature causes those specific past conversations to permanently and directly retrain the underlying model itself, meaning any detail the manager previously mentioned should, in principle, now be part of the model's core knowledge indefinitely.",
"The memory feature should simply be disabled entirely going forward, on the reasoning that a feature which fails to carry forward a specific six-week-old detail into a completely new chat has effectively been demonstrated not to work at all and therefore offers no genuine value.",
"The underlying model itself carries essentially nothing forward between separate chats on its own; a memory feature works by saving notes from past conversations and feeding relevant ones back into later chats, so genuinely stable, important client context is generally more reliable when it is deliberately maintained in project knowledge or standing instructions that the team actively reviews and keeps current, rather than relied upon implicitly through memory alone.",
"Ask Claude directly, at the start of the new chat, to 'try harder' to recall the specific detail from six weeks ago, on the reasoning that an explicit instruction to try harder can prompt the model to search its own underlying knowledge more thoroughly for context it might otherwise have missed."],
a:2,e:"A memory feature stores and selectively surfaces notes from past conversations; it does not retrain the underlying model, and it is not guaranteed to resurface every specific detail from weeks earlier in a brand-new chat. Stable, important context is more reliably handled through deliberately maintained project knowledge or standing instructions. Disabling memory entirely discards a genuinely useful feature over one gap, and asking the model to 'try harder' has no real mechanism behind it since there is nothing further for it to search."},
{d:"Governance & Responsible Use",q:"An associate at a firm working on a confidential acquisition wants to summarize draft deal documents. The company has an approved enterprise Claude account with defined data terms, but a consumer app on his phone is faster. Which choice is most responsible?",o:[
"Use the faster consumer app on his phone, and simply delete the resulting chat conversation immediately afterward, on the reasoning that deleting the chat from his own device history is generally sufficient to address any data-handling concerns that would otherwise apply to using an unapproved consumer tool for confidential deal documents.",
"Use the firm's approved enterprise account, which operates under the firm's actual data-classification rules and defined data terms, redact document content further where genuinely feasible, and if the approved route is meaningfully slower or more cumbersome than the consumer app, raise that specific friction with the policy owner so the approved process itself can potentially be improved.",
"Split the confidential deal documents into several smaller pieces before pasting each piece separately into the faster consumer app, on the theory that no individual smaller fragment looks confidential enough on its own to trigger meaningful data-handling concerns even though the documents collectively remain highly sensitive.",
"Use the faster consumer app, but first manually replace only the specific company names mentioned in the documents with generic placeholders, treating that single substitution as sufficient to remove any meaningful confidentiality risk from the remaining deal terms, financial figures, and structure."
],a:1,e:"Creation diligence for genuinely confidential material starts with actually using the approved tool operating under defined data terms, not an unapproved consumer app. Deleting a chat afterward does not undo whatever a third-party consumer service may already have processed or retained, fragmenting the documents does not meaningfully reduce the underlying confidentiality of the collective content, and replacing only company names leaves deal structure, financial terms, and other identifying specifics fully intact. Genuine friction with the approved route should be reported to be fixed, not quietly routed around."},
{d:"Governance & Responsible Use",q:"A consultancy delivers monthly reports partly drafted by Claude. Some client contracts require disclosure of automated tools, and a regulator-facing report affects thousands of people. A partner asks whether disclosure matters if the output is accurate. What is the best guidance?",o:[
"No disclosure of AI assistance is ever genuinely necessary as long as a human on the team has reviewed and edited the text at some point before it goes out, regardless of what any specific client contract says or how many people the resulting report ultimately affects.",
"Disclose the use of AI assistance uniformly on absolutely every single document the firm produces, including entirely internal personal notes with no external audience, on the reasoning that maximal, undifferentiated transparency about tool use is always the safest possible default in every context.",
"Whether disclosure is genuinely necessary depends solely on whether the resulting output happens to be factually accurate, meaning a report with zero factual errors carries no disclosure obligation regardless of what any relevant contract, regulation, or audience actually requires.",
"Match the level of transparency to actual impact: check what the specific contractual and legal requirements genuinely say in each case, disclose AI's role where it would matter to the people actually affected by the report (particularly for the regulator-facing report reaching thousands), independently verify the facts and calculations regardless of disclosure status, and keep a specific named human who actually signs and takes ownership of the final report."
],a:3,e:"The strength of the case for transparency scales with how many people a result affects and what contracts or regulations actually require, and accountability for a report's content cannot be automated away regardless of disclosure. Accuracy alone does not satisfy a contractual or legal disclosure obligation that may exist independently of correctness, and applying the same maximal disclosure standard to every internal note as to a regulator-facing report ignores the very impact-scaling this decision should be based on."},
{d:"Troubleshooting & Optimization",q:"A company created a reusable skill for reviewing purchase contracts, but Claude rarely uses it. The skill's description says only 'Helps with documents'. Which fix is most likely to help?",o:[
"Rewrite the skill's description to state specifically and clearly what the skill actually does and precisely when it should be triggered — for example, that it is meant for reviewing purchase or vendor contracts specifically for payment terms, liability provisions, and termination clauses — and then test the revised description against a range of realistic user requests to confirm it now triggers appropriately.",
"Instruct users to type out the skill's exact internal file name as part of every single request where they want it to apply, effectively requiring manual invocation by name rather than having the skill trigger naturally based on the actual content of a realistic request.",
"Create several duplicate copies of the same underlying skill under five slightly different descriptive names, on the reasoning that having more differently-named versions of essentially the same skill available increases the statistical odds that at least one of them happens to trigger correctly for any given contract-review request.",
"Substantially lengthen the skill's internal working instructions and procedural content without changing its short external description at all, on the assumption that a skill's internal instruction length, rather than its external description, is what actually determines whether Claude recognizes a given request as relevant and chooses to trigger and load that skill."
],a:0,e:"A skill's description is specifically what the model uses to decide whether a given request matches it, so a vague description like 'Helps with documents' causes exactly the kind of missed triggering seen here; a clear, specific description of scope and trigger conditions, tested against realistic requests, is the direct fix. Requiring users to name the file manually defeats the purpose of automatic triggering, duplicating the skill under multiple names does not fix the underlying vague description any of the copies still share, and lengthening internal instructions does nothing to help the model recognize when the skill applies in the first place."}
];

const PASS=72,SEC=900,app=document.getElementById('app');
let ans=Array(Q.length).fill(-1),cur=0,left=SEC,tm=null,done=false,rev=false;
const L="ABCD";
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function start(){app.innerHTML=`<div class="card"><div class="dm">Practice Exam · Block 2 of 5</div><h1 style="margin:.2em 0">CCAO-F Practice Exam</h1><p>Questions 16–30: 15 new scenario-based questions covering all seven blueprint domains, built from the Agent Factory study guide (4Ds, output evaluation, workflow design, skills &amp; connectors, governance).</p><p><b>Time:</b> 15 minutes · <b>Pass:</b> ${PASS}% (${Math.ceil(Q.length*PASS/100)} of ${Q.length}) · Feedback is shown only after you submit.</p><button class="b" onclick="go()">Start exam</button></div>`}
function go(){tm=setInterval(()=>{left--;const e=document.getElementById('tm');if(e){e.textContent=fmt(left);e.classList.toggle('lo',left<300)}if(left<=0)finish()},1000);draw()}
function draw(){const q=Q[cur];app.innerHTML=`<div class="bar"><span>Question ${cur+1}/${Q.length}</span><span class="t" id="tm">${fmt(left)}</span><button class="b" style="padding:7px 12px;font-size:14px" onclick="sub()">■ Stop &amp; get result</button></div><div class="pg"><i style="width:${(ans.filter(x=>x>=0).length/Q.length)*100}%"></i></div><div class="card"><div class="dm">${q.d}</div><p><b>Scenario:</b> ${q.q}</p>${q.o.map((t,i)=>`<button class="o ${ans[cur]===i?'s':''}" onclick="pick(${i})"><b>${L[i]})</b> ${t}</button>`).join('')}</div><div class="r"><button class="b g" onclick="mv(-1)" ${cur?'':'disabled'}>← Back</button>${cur<Q.length-1?`<button class="b" onclick="mv(1)">Next →</button>`:`<button class="b" onclick="sub()">Submit exam</button>`}</div><div class="nav">${Q.map((_,i)=>`<span class="${ans[i]>=0?'d':''} ${i===cur?'c2':''}" onclick="cur=${i};draw()">${i+1}</span>`).join('')}</div>`}
function pick(i){ans[cur]=i;draw()}function mv(n){cur+=n;draw()}
function sub(){const u=ans.filter(x=>x<0).length;if(!u||confirm(u+' question(s) unanswered. Submit anyway?'))finish()}
function finish(){if(done)return;done=true;clearInterval(tm);result()}
function result(){const ok=Q.map((q,i)=>ans[i]===q.a),n=ok.filter(Boolean).length,p=Math.round(n/Q.length*1000)/10,pass=p>=PASS;
const dom={};Q.forEach((q,i)=>{dom[q.d]=dom[q.d]||[0,0];dom[q.d][1]++;if(ok[i])dom[q.d][0]++});
app.innerHTML=`<div class="card">${pass?'<div class="star">⭐</div>':''}<h1 class="c" style="margin:.1em 0">${pass?'You passed! 🎉':'Not quite yet'}</h1><p class="big" style="color:${pass?'var(--ok)':'var(--no)'}">${p}%</p><p class="c">${n} of ${Q.length} correct · pass mark ${PASS}% · time used ${fmt(SEC-left)}</p><p class="c">${pass?'Outstanding work, shining star! Ready for Block 3.':'Review the explanations below, then retry. Weak domains are the likeliest to sink you on a different question draw.'}</p></div><div class="card"><b>Score by domain</b>${Object.entries(dom).map(([k,v])=>`<div class="dr"><span>${k}</span><span>${v[0]}/${v[1]}</span></div>`).join('')}</div><div class="r"><button class="b" onclick="rv()">Review answers</button><button class="b g" onclick="location.reload()">Retake</button></div>`;
if(pass)for(let i=0;i<28;i++)setTimeout(()=>{const s=document.createElement('div');s.className='sp';s.textContent=['⭐','✨','🌟'][i%3];s.style.left=Math.random()*95+'vw';s.style.top=(40+Math.random()*50)+'vh';document.body.appendChild(s);setTimeout(()=>s.remove(),2500)},i*90)}
function rv(){app.innerHTML=`<div class="r"><button class="b g" onclick="result()">← Results</button></div>`+Q.map((q,i)=>`<div class="card"><div class="dm">Q${i+1} · ${q.d}</div><p>${q.q}</p>${q.o.map((t,j)=>`<div class="o ${j===q.a?'ok':(j===ans[i]?'no':'')}"><b>${L[j]})</b> ${t}${j===ans[i]?' <i>(your answer)</i>':''}</div>`).join('')}<div class="ex"><b>Correct: ${L[q.a]}.</b> ${q.e}</div></div>`).join('')}
start();
</script></body></html>
